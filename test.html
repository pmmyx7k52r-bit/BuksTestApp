<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kroatisch Master v1.7.5</title>
<style>
:root { --hr-blue: #002395; --bg: #f0f2f5; --red: #ff4444; --green: #28a745; }
body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
.card { max-width: 500px; width: 100%; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10px; box-sizing: border-box; }
h2 { color: var(--hr-blue); font-size: 0.9rem; margin: 0 0 10px 0; text-transform: uppercase; border-bottom: 1px solid #eee; }
input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 8px; box-sizing: border-box; font-size: 1rem; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 5px; }
.btn-add { background: var(--hr-blue); }
.btn-flash { background: #000; }
.btn-hint { background: #666; font-size: 0.8rem; }
.btn-stop { background: var(--red); display: none; }
.dict-toggle-btn { background: #eee; color: #333; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; width: 100%; border: 1px solid #ccc; }
#dictContent { display: none; margin-top: 10px; }
.dict-list { max-height: 300px; overflow-y: auto; font-size: 0.9rem; }
.cat-head { background: #e8e8e8; padding: 5px; font-weight: bold; font-size: 0.7rem; margin-top: 12px; border-radius: 4px; color: #444; border-left: 4px solid var(--hr-blue); }
.entry { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
.del-btn { color: var(--red); font-weight: bold; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; border: 1px solid #ffcccc; border-radius: 5px; background: #fff5f5; }

.flash-box { height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; border: 4px solid #eee; border-radius: 12px; text-align: center; position: relative; }
.flash-active { background: #000 !important; color: #fff !important; border-color: #333; }
.flash-hr { font-size: 2.2rem; font-weight: 900; color: var(--hr-blue); }
.flash-active .flash-hr { color: #fff; }
.flash-de { font-size: 1.1rem; color: #888; margin-top: 5px; }
#solutionHint { display: none; color: var(--red); text-align: center; font-weight: bold; margin: 10px 0; font-size: 1.2rem; background: #fff0f0; padding: 15px; border-radius: 8px; border: 1px solid var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
</style>
</head>
<body>

<div class="card">
<h2>1. Eingabe & Wörterbuch</h2>
<input type="text" id="hrIn" placeholder="Kroatisch">
<input type="text" id="deIn" placeholder="Deutsch">
<select id="catIn">
<option value="Allgemein">Kategorie: Allgemein</option>
<option value="Zahlen/Tage">Zahlen & Tage</option>
<option value="Essen/Trinken">Essen & Trinken</option>
<option value="Verben">Verben</option>
</select>
<button class="btn btn-add" onclick="saveWort()">SPEICHERN</button>
<div class="dict-toggle-btn" id="tBtnLabel" onclick="toggleDictionary()">WÖRTERBUCH ANZEIGEN</div>
<div id="dictContent"><div id="dictionaryList" class="dict-list"></div></div>
</div>

<div class="card" id="trainArea" style="display:none;">
<h2>2. Bewusstes Training</h2>
<div id="question" style="font-size:1.5rem; text-align:center; font-weight:bold; margin:10px; color:#333;"></div>
<div id="solutionHint"></div>
<input type="text" id="answer" placeholder="Antwort eintippen..." onkeypress="if(event.key==='Enter') checkInput()">
<button id="hintBtn" class="btn btn-hint" onclick="showSolution()">WEISS ICH NICHT</button>
<div id="feedback" style="text-align:center; height:20px; font-weight:bold; margin-top:5px;"></div>
</div>

<div class="card">
<h2>3. Subliminal Flash (0.06s)</h2>
<div id="fBox" class="flash-box">
<div id="fHr" class="flash-hr">START</div>
<div id="fDe" class="flash-de">bereit</div>
</div>
<button id="sBtn" class="btn btn-flash" onclick="startFlash()">ULTRA-FLASH STARTEN</button>
<button id="stopBtn" class="btn btn-stop" onclick="stopFlash()">STOPP</button>
</div>

<script>
const STORAGE_KEY = 'kroatisch_master_final_v1';
let daten = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let currentItem = null;
let isLocked = false;

function toggleDictionary() {
const c = document.getElementById('dictContent');
const b = document.getElementById('tBtnLabel');
const isShow = c.style.display === 'block';
c.style.display = isShow ? 'none' : 'block';
b.innerText = isShow ? 'WÖRTERBUCH ANZEIGEN' : 'WÖRTERBUCH VERBERGEN';
if(!isShow) renderList();
}

function renderList() {
const list = document.getElementById('dictionaryList');
if (daten.length === 0) { list.innerHTML = "<p style='text-align:center; color:#ccc;'>Noch keine Wörter vorhanden.</p>" return; }
daten.sort((a, b) => a.cat.localeCompare(b.cat) || a.hr.localeCompare(b.hr));
let html = "", lastCat = ""
daten.forEach((item, index) => {
if(item.cat !== lastCat) {
html += `<div class="cat-head">${item.cat.toUpperCase()}</div>`;
lastCat = item.cat;
}
html += `<div class="entry">
<span><b>${item.hr}</b> - ${item.de}</span>
<div class="del-btn" onclick="deleteEntry(${index})">Löschen</div>
</div>`;
});
list.innerHTML = html;
}

function deleteEntry(index) {
if(confirm("Dieses Wort wirklich löschen?")) {
daten.splice(index, 1);
saveAndReload();
}
}

function saveWort() {
const h = document.getElementById('hrIn').value.trim();
const d = document.getElementById('deIn').value.trim();
const c = document.getElementById('catIn').value;
if (!h || !d) return;
daten.push({hr: h, de: d, cat: c});
saveAndReload();
}

function saveAndReload() {
localStorage.setItem(STORAGE_KEY, JSON.stringify(daten));
location.reload();
}

function nextQuestion() {
if(daten.length === 0) return;
isLocked = false;
document.getElementById('answer').disabled = false;
document.getElementById('hintBtn').style.display = 'block';
document.getElementById('solutionHint').style.display = 'none';
document.getElementById('feedback').innerText = ""
currentItem = daten[Math.floor(Math.random() * daten.length)];
document.getElementById('question').innerText = Math.random() > 0.5 ? currentItem.de : currentItem.hr;
document.getElementById('answer').value = ""
document.getElementById('answer').focus();
}

function showSolution() {
isLocked = true;
const hintDiv = document.getElementById('solutionHint');
hintDiv.innerText = `MERKEN: ${currentItem.hr} = ${currentItem.de}`;
hintDiv.style.display = 'block';
document.getElementById('answer').disabled = true;
document.getElementById('hintBtn').style.display = 'none';
setTimeout(() => {
hintDiv.style.display = 'none';
document.getElementById('answer').disabled = false;
document.getElementById('answer').focus();
document.getElementById('feedback').innerText = "Jetzt eintippen!"
isLocked = false;
}, 5000);
}

function checkInput() {
if(isLocked) return;
const val = document.getElementById('answer').value.trim().toLowerCase();
if (val === currentItem.hr.toLowerCase() || val === currentItem.de.toLowerCase()) {
document.getElementById('feedback').style.color = "green"
document.getElementById('feedback').innerText = "✓ Richtig!"
window.speechSynthesis.speak(new SpeechSynthesisUtterance(currentItem.hr));
setTimeout(nextQuestion, 800);
} else {
document.getElementById('feedback').style.color = "red"
document.getElementById('feedback').innerText = "Falsch, nochmal!"
}
}

let flashInterval = null;
function startFlash() {
if (daten.length === 0) return;
document.getElementById('sBtn').style.display = 'none';
document.getElementById('stopBtn').style.display = 'block';
document.getElementById('fBox').classList.add('flash-active');
flashInterval = setInterval(() => {
const r = daten[Math.floor(Math.random() * daten.length)];
document.getElementById('fHr').innerText = r.hr;
document.getElementById('fDe').innerText = r.de;
}, 60);
}
function stopFlash() {
clearInterval(flashInterval);
document.getElementById('sBtn').style.display = 'block';
document.getElementById('stopBtn').style.display = 'none';
document.getElementById('fBox').classList.remove('flash-active');
}

if (daten.length > 0) {
document.getElementById('trainArea').style.display = 'block';
nextQuestion();
}
</script>
</body>
</html>

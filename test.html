<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajna Trainer v1.4</title>
<style>
:root { --main: #0a2394; --accent: #8d5cf6; --bg: #f0f2f5; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 10px; margin: 0; }
.card { background: white; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.15); width: 100%; max-width: 400px; padding: 25px; text-align: center; }
.timer-box { position: relative; margin: 10px 0; }
.timer { font-size: 4rem; font-weight: 800; color: var(--main); line-height: 1; }
.timer-select { margin-top: 5px; font-size: 0.8rem; color: #888; }
.timer-select span { cursor: pointer; padding: 2px 8px; border: 1px solid #ddd; border-radius: 5px; margin: 0 3px; }
.timer-select .active { background: var(--main); color: white; border-color: var(--main); }

.field { height: 120px; background: #e9ecef; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 20px 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 3px solid transparent; font-weight: bold; font-size: 1.2rem; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.color-btn { height: 55px; border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.stats-panel { margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.stat-item { font-size: 0.7rem; color: #666; }
.stat-bar { height: 30px; width: 100%; background: #eee; border-radius: 5px; overflow: hidden; margin-top: 5px; position: relative; }
.stat-fill { height: 100%; background: var(--accent); transition: width 0.5s; width: 0%; }
.btn-main { background: var(--main); color: white; width: 100%; padding: 18px; border-radius: 18px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
<div id="status" style="font-size:0.7rem; color:var(--accent); font-weight:bold; letter-spacing:1px;">VERSION 1.4 READY</div>
<div class="timer-box">
<div id="timerDisplay" class="timer">10</div>
<div class="timer-select" id="timerSelect">
<span onclick="setTimer(5)">5s</span>
<span class="active" onclick="setTimer(10)">10s</span>
<span onclick="setTimer(20)">20s</span>
</div>
</div>

<div id="targetField" class="field">Start drücken</div>

<div id="startPhase">
<button class="btn-main" onclick="firstStart()">SESSION STARTEN</button>
</div>

<div id="guessPhase" class="hidden">
<div class="grid">
<button class="color-btn" style="background:#ff4757" onclick="record('ROT')">ROT</button>
<button class="color-btn" style="background:#2f35d0" onclick="record('BLAU')">BLAU</button>
<button class="color-btn" style="background:#2ed573" onclick="record('GRÜN')">GRÜN</button>
<button class="color-btn" style="background:#ffa502" onclick="record('GELB')">GELB</button>
</div>

<div class="stats-panel">
<div class="stat-item">ROT<div class="stat-bar"><div id="bar-ROT" class="stat-fill"></div></div></div>
<div class="stat-item">BLAU<div class="stat-bar"><div id="bar-BLAU" class="stat-fill"></div></div></div>
<div class="stat-item">GRÜN<div class="stat-bar"><div id="bar-GRÜN" class="stat-fill"></div></div></div>
<div class="stat-item">GELB<div class="stat-bar"><div id="bar-GELB" class="stat-fill"></div></div></div>
</div>
<div style="font-size: 0.7rem; color: #aaa; margin-top: 10px;">
Gesamt: <span id="totalRounds">0</span> | Treffer: <span id="totalHits">0</span>
</div>
</div>
</div>

<script>
let solution = ""
let stats = { ROT: {h:0, t:0}, BLAU: {h:0, t:0}, GRÜN: {h:0, t:0}, GELB: {h:0, t:0} };
let audioCtx, osc1, osc2;
let timerSetting = 10;
let timerVal = 10;
let timerId;
let isWaiting = false;

function setTimer(s) {
timerSetting = s;
document.querySelectorAll('.timer-select span').forEach(el => el.classList.remove('active'));
event.target.classList.add('active');
document.getElementById('timerDisplay').innerText = s;
}

function startBinaural() {
if(!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
osc1 = audioCtx.createOscillator(); osc2 = audioCtx.createOscillator();
let p1 = audioCtx.createStereoPanner(); let p2 = audioCtx.createStereoPanner();
let g = audioCtx.createGain();
osc1.frequency.value = 200; p1.pan.value = -1;
osc2.frequency.value = 210; p2.pan.value = 1;
g.gain.value = 0.04;
osc1.connect(p1).connect(g).connect(audioCtx.destination);
osc2.connect(p2).connect(g).connect(audioCtx.destination);
osc1.start(); osc2.start();
}
}

function playGong(freq) {
const o = audioCtx.createOscillator();
const g = audioCtx.createGain();
o.type = 'sine';
o.frequency.setValueAtTime(freq, audioCtx.currentTime);
g.gain.setValueAtTime(0.2, audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
o.connect(g).connect(audioCtx.destination);
o.start(); o.stop(audioCtx.currentTime + 1);
}

function firstStart() {
startBinaural();
document.getElementById('startPhase').classList.add('hidden');
document.getElementById('guessPhase').classList.remove('hidden');
document.getElementById('timerSelect').style.opacity = "0.3"
nextRound();
}

function nextRound() {
isWaiting = false;
const colors = ["ROT", "BLAU", "GRÜN", "GELB"];
solution = colors[Math.floor(Math.random() * colors.length)];
const field = document.getElementById('targetField');
field.style.background = "#e9ecef"
field.style.color = "#333"
field.innerText = "Fühle..."
document.getElementById('status').innerText = "ALPHA FLOW"
timerVal = timerSetting;
document.getElementById('timerDisplay').innerText = timerVal;
clearInterval(timerId);
timerId = setInterval(() => {
timerVal--;
document.getElementById('timerDisplay').innerText = timerVal;
if(timerVal <= 0) document.getElementById('status').innerText = "IMPULS FOLGEN"
}, 1000);
}

function record(guess) {
if(isWaiting) return;
isWaiting = true;
clearInterval(timerId);
stats[solution].t++;
if(guess === solution) {
stats[solution].h++;
playGong(528); // "Liebes-Frequenz" für Treffer
if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
} else {
playGong(220);
}
updateStats();
const field = document.getElementById('targetField');
const colorMap = {"ROT":"#ff4757","BLAU":"#2f35d0","GRÜN":"#2ed573","GELB":"#ffa502"};
field.style.background = colorMap[solution];
field.style.color = "white"
field.innerText = solution;

setTimeout(nextRound, 2500);
}

function updateStats() {
let totalH = 0; let totalT = 0;
for(let c in stats) {
let perc = stats[c].t > 0 ? (stats[c].h / stats[c].t) * 100 : 0;
document.getElementById('bar-' + c).style.width = perc + "%"
totalH += stats[c].h; totalT += stats[c].t;
}
document.getElementById('totalHits').innerText = totalH;
document.getElementById('totalRounds').innerText = totalT;
}
</script>
</body>
</html>

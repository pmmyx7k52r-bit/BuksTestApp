<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intuition & Drittes Auge Trainer</title>
<style>
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e9e9e9; text-align: center; margin: 0; padding: 20px; }
.container { max-width: 500px; margin: auto; }
h1 { color: #8d5cf6; }
.module { background: #16213e; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #4831d4; }
button { background: #4831d4; color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 10px; transition: 0.3s; }
button:hover { background: #8d5cf6; }
#colorDisplay { width: 100%; height: 200px; border-radius: 15px; margin: 20px 0; background: #2e2e4e; border: 3px dashed #4831d4; display: flex; align-items: center; justify-content: center; font-size: 1.2em; }
.hidden { display: none; }
.stats { font-size: 0.9em; color: #aaa; }
</style>
</head>
<body>

<div class="container">
<h1>Ajna Trainer</h1>
<p>Der goldene Weg zum inneren Sehen</p>

<div class="module">
<h3>1. Vorbereitung (Alpha-Wellen)</h3>
<p>Schließe die Augen und harmonisiere deinen Geist.</p>
<button onclick="toggleAudio()">Alpha-Sound Start/Stop</button>
</div>

<div class="module">
<h3>2. Intuitions-Training</h3>
<p>Welche Farbe liegt "hinter" dem Schleier?</p>
<div id="colorDisplay">Konzentriere dich...</div>
<div id="controls">
<button onclick="startTest()">Farbe generieren</button>
</div>
<div id="guessButtons" class="hidden">
<p>Was nimmst du wahr?</p>
<button onclick="checkGuess('Rot')" style="background:#e94560;">Rot</button>
<button onclick="checkGuess('Blau')" style="background:#0f3460;">Blau</button>
<button onclick="checkGuess('Grün')" style="background:#28a745;">Grün</button>
</div>
<p class="stats">Treffer: <span id="score">0</span> / Versuche: <span id="total">0</span></p>
</div>
</div>

<script>
let currentColor = ""
let score = 0;
let total = 0;
let audioCtx = null;
let oscillator = null;

// --- MODUL 1: AUDIO (ALPHA WELLEN SIMULATION) ---
function toggleAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
oscillator = audioCtx.createOscillator();
let gainNode = audioCtx.createGain();
oscillator.type = 'sine';
oscillator.frequency.setValueAtTime(10, audioCtx.currentTime); // 10Hz Alpha Bereich
gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);
oscillator.start();
} else {
audioCtx.close();
audioCtx = null;
}
}

// --- MODUL 2: FARB-TEST ---
function startTest() {
const colors = ["Rot", "Blau", "Grün"];
currentColor = colors[Math.floor(Math.random() * colors.length)];
document.getElementById('colorDisplay').style.background = "#2e2e4e"
document.getElementById('colorDisplay').innerText = "Wahrnehmung läuft..."
document.getElementById('guessButtons').classList.remove('hidden');
document.getElementById('controls').classList.add('hidden');
}

function checkGuess(guess) {
total++;
const display = document.getElementById('colorDisplay');
const colorMap = { "Rot": "#e94560", "Blau": "#0f3460", "Grün": "#28a745" };
display.style.background = colorMap[currentColor];
if (guess === currentColor) {
score++;
display.innerText = "Richtig! Die Farbe ist " + currentColor;
} else {
display.innerText = "Falsch. Es war " + currentColor;
}

document.getElementById('score').innerText = score;
document.getElementById('total').innerText = total;
document.getElementById('guessButtons').classList.add('hidden');
document.getElementById('controls').classList.remove('hidden');
}
</script>

</body>
</html>

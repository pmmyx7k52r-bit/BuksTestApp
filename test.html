<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kroatisch Master v1.3.0</title>
<style>
:root { --hr-red: #ff0000; --hr-blue: #002395; --dark: #1a1a1a; --light-bg: #f4f7f6; --green: #28a745; }
body { font-family: 'Segoe UI', sans-serif; background: var(--light-bg); display: flex; flex-direction: column; align-items: center; padding: 20px; color: var(--dark); }
.container { max-width: 500px; width: 100%; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; }
h2 { text-align: center; color: var(--hr-blue); margin-top: 0; font-size: 1.5rem; }
.section-title { font-size: 0.8rem; font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
/* Eingabe */
.input-group { display: flex; gap: 8px; margin-bottom: 12px; }
input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 0.9rem; outline: none; transition: 0.3s; }
input:focus { border-color: var(--hr-blue); }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
.btn-blue { background: var(--hr-blue); }
.btn-green { background: var(--green); }
.btn-flash { background: var(--dark); }
.btn-stop { background: var(--hr-red); display: none; }
.btn:active { transform: scale(0.98); }

/* Wörterbuch Liste */
.dict-list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; border-radius: 10px; margin-top: 10px; }
.dict-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #f9f9f9; cursor: pointer; transition: background 0.2s; }
.dict-item:hover { background: #f0f4ff; }
.dict-item b { color: var(--hr-blue); }
/* Display */
.display-area { height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #fafafa; border-radius: 20px; margin: 15px 0; position: relative; overflow: hidden; }
.hr-text { font-size: 2.2rem; font-weight: 800; color: var(--hr-blue); z-index: 2; }
.de-text { font-size: 1.1rem; color: #888; z-index: 2; }

.flash-active { background: #000 !important; }
.flash-active .hr-text { color: #fff; font-size: 2.8rem; }
.flash-active .de-text { color: #666; }

.feedback { font-weight: bold; text-align: center; height: 20px; margin-top: 5px; }
</style>
</head>
<body>

<div class="container">
<h2>Erfassung & Wörterbuch</h2>
<div class="input-group">
<input type="text" id="addHr" placeholder="Kroatisch">
<input type="text" id="addDe" placeholder="Deutsch">
</div>
<button class="btn btn-blue" onclick="addVocab()">Hinzufügen</button>
<div class="section-title" style="margin-top: 20px;">Dein Wörterbuch (Klick für Audio)</div>
<div id="dictionary" class="dict-list">
</div>
<div style="text-align: right; margin-top: 8px;">
<span style="color:#ccc; cursor:pointer; font-size: 0.7rem;" onclick="clearAll()">Kompletten Speicher löschen</span>
</div>
</div>

<div class="container">
<div class="section-title">Lernbereich (Interaktiv)</div>
<div id="learnPrompt" style="text-align:center; font-size: 1.3rem; margin-bottom: 15px;">-</div>
<input type="text" id="learnInput" placeholder="Antwort eingeben..." onkeypress="if(event.key==='Enter') checkLearn()">
<div id="feedback" class="feedback"></div>
</div>

<div class="container">
<div class="section-title">Brain-Sequenz (Endlos-Flash)</div>
<div class="display-area" id="flashDisplay">
<div id="displayHr" class="hr-text">START</div>
<div id="displayDe" class="de-text">bereit für Flash</div>
</div>
<button class="btn btn-flash" onclick="startFlash()" id="flashBtn">Start (0.2s Takt)</button>
<button class="btn btn-stop" onclick="stopFlash()" id="stopBtn">STOPP</button>
</div>

<script>
let vocabList = JSON.parse(localStorage.getItem('myFullDict')) || [];
let currentItem = null;
let flashInterval = null;

renderDictionary();
if(vocabList.length > 0) nextQuestion();

function addVocab() {
const hr = document.getElementById('addHr').value.trim();
const de = document.getElementById('addDe').value.trim();
if(!hr || !de) return;
vocabList.push({ hr, de });
save();
renderDictionary();
document.getElementById('addHr').value = ""
document.getElementById('addDe').value = ""
document.getElementById('addHr').focus();
if(!currentItem) nextQuestion();
}

function renderDictionary() {
const dictDiv = document.getElementById('dictionary');
dictDiv.innerHTML = vocabList.length === 0 ? '<div style="padding:10px; color:#ccc;">Noch keine Einträge...</div>' : '';
vocabList.forEach((item, index) => {
const div = document.createElement('div');
div.className = 'dict-item';
div.onclick = () => speak(item.hr);
div.innerHTML = `<span><b>${item.hr}</b></span> <span>${item.de}</span>`;
dictDiv.appendChild(div);
});
}

// --- LERNEN ---
function nextQuestion() {
if(vocabList.length === 0) return;
currentItem = vocabList[Math.floor(Math.random() * vocabList.length)];
const askDe = Math.random() > 0.5;
document.getElementById('learnPrompt').innerText = askDe ? currentItem.de : currentItem.hr;
document.getElementById('learnInput').value = ""
document.getElementById('feedback').innerText = ""
}

function checkLearn() {
const val = document.getElementById('learnInput').value.trim().toLowerCase();
const feedback = document.getElementById('feedback');
const correctHr = currentItem.hr.toLowerCase();
const correctDe = currentItem.de.toLowerCase();

if(val === correctHr || val === correctDe) {
feedback.style.color = "green"
feedback.innerText = "Hervorragend!"
speak(currentItem.hr);
setTimeout(nextQuestion, 1200);
} else {
feedback.style.color = "red"
feedback.innerText = "Nicht ganz..."
}
}

// --- FLASH ---
function startFlash() {
if(vocabList.length === 0) return alert("Wörterbuch ist leer!");
document.getElementById('flashBtn').style.display = 'none';
document.getElementById('stopBtn').style.display = 'block';
document.getElementById('flashDisplay').classList.add('flash-active');
flashInterval = setInterval(() => {
const randomItem = vocabList[Math.floor(Math.random() * vocabList.length)];
document.getElementById('displayHr').innerText = randomItem.hr;
document.getElementById('displayDe').innerText = randomItem.de;
}, 200); // 0,2 Sekunden
}

function stopFlash() {
clearInterval(flashInterval);
document.getElementById('flashBtn').style.display = 'block';
document.getElementById('stopBtn').style.display = 'none';
document.getElementById('flashDisplay').classList.remove('flash-active');
document.getElementById('displayHr').innerText = "PAUSE"
document.getElementById('displayDe').innerText = "Sequenz gestoppt"
}

// --- TOOLS ---
function speak(text) {
window.speechSynthesis.cancel();
const msg = new SpeechSynthesisUtterance(text);
msg.lang = 'hr-HR';
msg.rate = 0.9; // Etwas langsamer für bessere Klarheit
window.speechSynthesis.speak(msg);
}

function save() { localStorage.setItem('myFullDict', JSON.stringify(vocabList)); }
function clearAll() {
if(confirm("Alle Vokabeln löschen?")) {
localStorage.clear();
location.reload();
}
}
</script>
</body>
</html>

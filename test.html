<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kroatisch Master v1.2.0</title>
<style>
:root { --hr-red: #ff0000; --hr-blue: #002395; --dark: #1a1a1a; --light-bg: #f0f2f5; --green: #28a745; }
body { font-family: 'Segoe UI', sans-serif; background: var(--light-bg); display: flex; flex-direction: column; align-items: center; padding: 20px; color: var(--dark); }
.container { max-width: 500px; width: 100%; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
h2 { text-align: center; color: var(--hr-blue); margin-top: 0; }
.section-title { font-size: 0.9rem; font-weight: bold; color: #888; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
.input-group { display: flex; gap: 10px; margin-bottom: 15px; }
input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 0.9rem; outline: none; }
input:focus { border-color: var(--hr-blue); }
.btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; margin-bottom: 10px; }
.btn-blue { background: var(--hr-blue); }
.btn-green { background: var(--green); }
.btn-flash { background: var(--dark); }
.display-area { height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #f9f9f9; border-radius: 20px; margin: 15px 0; border: 2px solid #eee; }
.hr-text { font-size: 2rem; font-weight: 800; color: var(--hr-blue); }
.de-text { font-size: 1.2rem; color: #666; }

.flash-mode { background: #000 !important; border: none; }
.flash-mode .hr-text { color: #fff; font-size: 2.5rem; }
.flash-mode .de-text { color: #aaa; }

.stats { font-size: 0.8rem; color: #999; text-align: center; margin-top: 10px; display: flex; justify-content: space-between; }
.feedback { font-weight: bold; margin-top: 5px; height: 20px; }
</style>
</head>
<body>

<div class="container">
<h2>Wörterbuch & Erfassung</h2>
<div class="section-title">Neue Vokabel</div>
<div class="input-group">
<input type="text" id="addHr" placeholder="Kroatisch">
<input type="text" id="addDe" placeholder="Deutsch">
</div>
<button class="btn btn-blue" onclick="addVocab()">Ins Wörterbuch speichern</button>
<div class="stats">
<span id="vocabCount">Einträge: 0</span>
<span style="color:red; cursor:pointer" onclick="clearAll()">Wörterbuch löschen</span>
</div>
</div>

<div class="container">
<div class="section-title">Lernbereich (mit Sprache)</div>
<div id="learnPrompt" style="text-align:center; font-size: 1.2rem; margin-bottom: 10px; font-weight: bold;">-</div>
<input type="text" id="learnInput" placeholder="Übersetzung tippen..." onkeypress="if(event.key==='Enter') checkLearn()">
<div id="feedback" class="feedback" style="text-align:center;"></div>
<button class="btn btn-green" style="margin-top:10px" onclick="nextLearnItem()">Nächstes Wort</button>
</div>

<div class="container" id="flashContainer">
<div class="section-title">Unterbewusstsein (Blitz-Modus)</div>
<div class="display-area" id="mainDisplay">
<div id="displayHr" class="hr-text">START</div>
<div id="displayDe" class="de-text">bereit</div>
</div>
<button class="btn btn-flash" onclick="startFlashSequence()" id="flashBtn">Blitz-Sequenz (Lautlos & Schnell)</button>
</div>

<script>
let vocabList = JSON.parse(localStorage.getItem('myDictionary')) || [];
let currentLearnItem = null;

updateUI();

function addVocab() {
const hr = document.getElementById('addHr').value.trim();
const de = document.getElementById('addDe').value.trim();
if (!hr || !de) return alert("Beide Felder ausfüllen!");
vocabList.push({ hr, de });
localStorage.setItem('myDictionary', JSON.stringify(vocabList));
document.getElementById('addHr').value = ""
document.getElementById('addDe').value = ""
updateUI();
if(!currentLearnItem) nextLearnItem();
}

function updateUI() {
document.getElementById('vocabCount').innerText = `Einträge: ${vocabList.length}`;
}

// --- LERNBEREICH ---
function nextLearnItem() {
if (vocabList.length === 0) return;
currentLearnItem = vocabList[Math.floor(Math.random() * vocabList.length)];
// Zufällig entscheiden ob DE -> HR oder HR -> DE gefragt wird
const mode = Math.random() > 0.5;
document.getElementById('learnPrompt').innerText = mode ? currentLearnItem.de : currentLearnItem.hr;
document.getElementById('learnInput').value = ""
document.getElementById('feedback').innerText = ""
document.getElementById('learnInput').focus();
}

function checkLearn() {
const input = document.getElementById('learnInput').value.trim().toLowerCase();
const feedback = document.getElementById('feedback');
const isCorrect = (input === currentLearnItem.hr.toLowerCase() || input === currentLearnItem.de.toLowerCase());
if (isCorrect) {
feedback.style.color = "green"
feedback.innerText = "Richtig! ✓"
speak(currentLearnItem.hr); // Hier ist Sprache erwünscht
setTimeout(nextLearnItem, 1000);
} else {
feedback.style.color = "red"
feedback.innerText = "Versuch es nochmal"
}
}

function speak(text) {
window.speechSynthesis.cancel();
const msg = new SpeechSynthesisUtterance(text);
msg.lang = 'hr-HR';
window.speechSynthesis.speak(msg);
}

// --- UNTERBEWUSSTSEIN (FLASH) ---
function startFlashSequence() {
if (vocabList.length === 0) return;
const btn = document.getElementById('flashBtn');
const display = document.getElementById('mainDisplay');
btn.disabled = true;
display.classList.add('flash-mode');
let count = 0;
const maxFlashes = 50;
const interval = setInterval(() => {
const item = vocabList[Math.floor(Math.random() * vocabList.length)];
document.getElementById('displayHr').innerText = item.hr;
document.getElementById('displayDe').innerText = item.de;
// KEINE Sprache hier, nur visuelles Flashen
count++;
if (count >= maxFlashes) {
clearInterval(interval);
display.classList.remove('flash-mode');
btn.disabled = false;
document.getElementById('displayHr').innerText = "FERTIG"
document.getElementById('displayDe').innerText = "Aufgenommen"
}
}, 200); // Sehr schnell: Alle 0,2 Sekunden ein neues Wort
}

function clearAll() {
if(confirm("Alles löschen?")) {
vocabList = [];
localStorage.clear();
location.reload();
}
}
// Initiales Wort laden
if(vocabList.length > 0) nextLearnItem();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kroatisch Master v1.7.3</title>
<style>
:root { --hr-blue: #002395; --bg: #f0f2f5; }
body { font-family: sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
.card { max-width: 500px; width: 100%; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10px; box-sizing: border-box; }
h2 { color: var(--hr-blue); font-size: 0.9rem; margin: 0 0 10px 0; text-transform: uppercase; border-bottom: 1px solid #eee; }
input, select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 8px; box-sizing: border-box; font-size: 1rem; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; margin-bottom: 5px; }
.btn-add { background: var(--hr-blue); }
.btn-flash { background: #000; }
.btn-stop { background: #ff4444; display: none; }
/* Absolut sicheres Wörterbuch */
.dict-toggle-btn { background: #eee; color: #333; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; width: 100%; border: 1px solid #ccc; margin-top: 5px; }
#dictContent { display: none; margin-top: 10px; background: #fafafa; border-radius: 8px; padding: 10px; border: 1px solid #eee; }
.dict-list { max-height: 250px; overflow-y: auto; font-size: 0.9rem; }
.entry { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }

.flash-box { height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; border: 4px solid #eee; border-radius: 12px; text-align: center; }
.flash-active { background: #000 !important; color: #fff !important; }
.flash-hr { font-size: 2rem; font-weight: 900; color: var(--hr-blue); }
.flash-active .flash-hr { color: #fff; }
.flash-de { font-size: 1rem; color: #888; }
</style>
</head>
<body>

<div class="card">
<h2>1. Eingabe</h2>
<input type="text" id="hrIn" placeholder="Kroatisch">
<input type="text" id="deIn" placeholder="Deutsch">
<select id="catIn">
<option value="Allgemein">Allgemein</option>
<option value="Zahlen/Tage">Zahlen & Tage</option>
<option value="Essen/Trinken">Essen & Trinken</option>
</select>
<button class="btn btn-add" onclick="saveWort()">SPEICHERN</button>
<div class="dict-toggle-btn" onclick="toggleDictionary()">WÖRTERBUCH ANZEIGEN</div>
<div id="dictContent">
<div id="dictionaryList" class="dict-list"></div>
<button onclick="emergencyImport()" style="margin-top:10px; font-size:0.7rem; color:blue; background:none; border:none; text-decoration:underline;">Daten-Rettung erzwingen</button>
</div>
</div>

<div class="card" id="trainArea" style="display:none;">
<h2>2. Training</h2>
<div id="question" style="font-size:1.4rem; text-align:center; font-weight:bold; margin:10px;"></div>
<input type="text" id="answer" placeholder="Antwort..." onkeypress="if(event.key==='Enter') checkInput()">
<div id="feedback" style="text-align:center; height:20px; font-weight:bold;"></div>
</div>

<div class="card">
<h2>3. Flash (60ms)</h2>
<div id="fBox" class="flash-box">
<div id="fHr" class="flash-hr">START</div>
<div id="fDe" class="flash-de">bereit</div>
</div>
<button id="sBtn" class="btn btn-flash" onclick="startFlash()">START</button>
<button id="tBtn" class="btn btn-stop" onclick="stopFlash()">STOPP</button>
</div>

<script>
const STORAGE_KEY = 'kroatisch_master_final_v1';
let daten = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

// 1. Einfaches Aufklappen (ohne Schnickschnack)
function toggleDictionary() {
const content = document.getElementById('dictContent');
if (content.style.display === 'block') {
content.style.display = 'none';
} else {
content.style.display = 'block';
refreshList();
}
}

// 2. Wörterliste anzeigen
function refreshList() {
const list = document.getElementById('dictionaryList');
if (daten.length === 0) {
list.innerHTML = "Keine Einträge gefunden."
return;
}
// Sortieren
daten.sort((a, b) => a.hr.localeCompare(b.hr));
let html = ""
daten.forEach(item => {
html += `<div class="entry"><b>${item.hr}</b> <span>${item.de}</span></div>`;
});
list.innerHTML = html;
}

// 3. Speichern
function saveWort() {
const h = document.getElementById('hrIn').value.trim();
const d = document.getElementById('deIn').value.trim();
const c = document.getElementById('catIn').value;
if (!h || !d) return;

daten.push({hr: h, de: d, cat: c});
localStorage.setItem(STORAGE_KEY, JSON.stringify(daten));
document.getElementById('hrIn').value = ""
document.getElementById('deIn').value = ""
alert("Gespeichert!");
location.reload();
}

// 4. Notfall-Import
function emergencyImport() {
const keys = ['masterDict_final', 'masterDict_v4', 'masterDict_v3', 'masterDict_v2', 'masterDict', 'simpleDict'];
keys.forEach(k => {
const old = JSON.parse(localStorage.getItem(k));
if (old && Array.isArray(old)) {
old.forEach(o => {
if (!daten.find(d => d.hr === o.hr)) daten.push(o);
});
}
});
localStorage.setItem(STORAGE_KEY, JSON.stringify(daten));
location.reload();
}

// 5. Training & Flash
let currentItem = null;
let flashInterval = null;

if (daten.length > 0) {
document.getElementById('trainArea').style.display = 'block';
nextQuestion();
}

function nextQuestion() {
currentItem = daten[Math.floor(Math.random() * daten.length)];
document.getElementById('question').innerText = Math.random() > 0.5 ? currentItem.de : currentItem.hr;
document.getElementById('answer').value = ""
document.getElementById('feedback').innerText = ""
}

function checkInput() {
const val = document.getElementById('answer').value.trim().toLowerCase();
if (val === currentItem.hr.toLowerCase() || val === currentItem.de.toLowerCase()) {
document.getElementById('feedback').innerText = "Richtig!"
window.speechSynthesis.speak(new SpeechSynthesisUtterance(currentItem.hr));
setTimeout(nextQuestion, 1000);
} else {
document.getElementById('feedback').innerText = "Versuch's nochmal"
}
}

function startFlash() {
if (daten.length === 0) return;
document.getElementById('sBtn').style.display = 'none';
document.getElementById('tBtn').style.display = 'block';
document.getElementById('fBox').classList.add('flash-active');
flashInterval = setInterval(() => {
const r = daten[Math.floor(Math.random() * daten.length)];
document.getElementById('fHr').innerText = r.hr;
document.getElementById('fDe').innerText = r.de;
}, 60);
}

function stopFlash() {
clearInterval(flashInterval);
document.getElementById('sBtn').style.display = 'block';
document.getElementById('tBtn').style.display = 'none';
document.getElementById('fBox').classList.remove('flash-active');
}
</script>
</body>
</html>

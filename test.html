<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intuitions-Trainer</title>
<style>
:root { --main-blue: #0a2394; --gold: #f1b04c; --bg: #f8f9fa; }
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 350px; padding: 25px; text-align: center; }
.timer-display { font-size: 3rem; font-weight: bold; color: var(--main-blue); margin: 20px 0; }
.status-text { color: #888; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; }
.field { background: #f0f2f5; border-radius: 12px; padding: 20px; margin: 15px 0; min-height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.5s; }
button { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 5px 0; }
.btn-start { background: var(--main-blue); color: white; font-size: 1.1rem; }
.btn-check { background: var(--gold); color: white; }
button:active { transform: scale(0.98); }
.hidden { display: none; }
</style>
</head>
<body>

<div class="card">
<div class="status-text" id="status">Bereit</div>
<div class="timer-display" id="timer">00</div>

<div class="field" id="mainField">---</div>

<div id="setupControls">
<button class="btn-start" onclick="startTraining()">START (TIMER)</button>
</div>

<div id="actionControls" class="hidden">
<button class="btn-check" onclick="reveal()">JETZT PRÜFEN</button>
</div>
</div>

<script>
let timeLeft = 10;
let timerInterval;
let currentColor = ""
const colors = ["ROT", "BLAU", "GRÜN", "GELB"];

// Audio-Initialisierung
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, duration) {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.frequency.value = freq;
gain.gain.value = 0.1;
osc.start();
setTimeout(() => osc.stop(), duration);
}

function startTraining() {
// Reset
timeLeft = 10;
document.getElementById('timer').innerText = timeLeft;
document.getElementById('status').innerText = "Konzentration..."
document.getElementById('mainField').innerText = "Fühle die Farbe"
document.getElementById('mainField').style.backgroundColor = "#f0f2f5"
// Farbe im Hintergrund wählen
currentColor = colors[Math.floor(Math.random() * colors.length)];
// UI umschalten
document.getElementById('setupControls').classList.add('hidden');
document.getElementById('actionControls').classList.remove('hidden');

beep(440, 200); // Start-Ton

// Timer starten
timerInterval = setInterval(() => {
timeLeft--;
document.getElementById('timer').innerText = (timeLeft < 10 ? "0" : "") + timeLeft;
if (timeLeft <= 0) {
clearInterval(timerInterval);
document.getElementById('status').innerText = "Zeit abgelaufen!"
beep(660, 400); // Ende-Ton
}
}, 1000);
}

function reveal() {
clearInterval(timerInterval);
const field = document.getElementById('mainField');
field.innerText = currentColor;
const colorMap = {"ROT": "#ff4d4d", "BLAU": "#4d94ff", "GRÜN": "#4dff88", "GELB": "#ffff4d"};
field.style.backgroundColor = colorMap[currentColor];
document.getElementById('status').innerText = "Ergebnis"
document.getElementById('setupControls').classList.remove('hidden');
document.getElementById('actionControls').classList.add('hidden');
document.getElementById('timer').innerText = "00"
}
</script>

</body>
</html>
